# Install once: `uv tool install pre-commit && pre-commit install`
# Update hook versions: `pre-commit autoupdate`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: no-pdfs
        name: PDFs must not be committed (use data/corpus.csv)
        entry: PDF files are not allowed in the repo
        language: fail
        files: \.pdf$
      - id: no-env
        name: .env must not be committed
        entry: .env files are not allowed in the repo (use .env.example)
        language: fail
        files: (^|/)\.env$
