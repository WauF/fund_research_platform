# Whole stack with one command:  cp .env.example .env && docker compose up --build
#   web  http://localhost:3000     api  http://localhost:8000/docs
#   seaweedfs admin  http://localhost:23646   s3  http://localhost:8333
#
# Every port is bound to 127.0.0.1 only. On the VPS, Docker-published ports bypass the host
# firewall, so nothing here may listen publicly; a reverse proxy in front exposes web/api.
#
# APP_VERSION picks the image tag (default "dev" = built locally). Deploy/rollback later is
# `APP_VERSION=v0.1.0 docker compose up -d` against images from ghcr.io.
name: fund-platform

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for PDFs: SeaweedFS (Apache-2.0) with its S3-compatible gateway. `weed mini`
  # runs master + volume + filer + S3 in one process, which fits a single-node deployment, and
  # creates the bucket on startup, so no init container is needed. S3 access requires the
  # key pair below; anonymous requests get 403. See docs/decisions/0001-object-storage-seaweedfs.md.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -bucket=${S3_BUCKET:?set in .env}
      - -admin.user=${S3_ACCESS_KEY:?set in .env}
      - -admin.password=${S3_SECRET_KEY:?set in .env}
      # Only S3 + Admin UI are used; keep the other gateways off.
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # Admin identity for the S3 API.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweedfsdata:/data
    ports:
      - "127.0.0.1:8333:8333" # S3 API
      - "127.0.0.1:23646:23646" # Admin UI
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply database migrations (alembic upgrade head), then exit. Safe to re-run.
  migrate:
    build: ./backend
    image: ghcr.io/wauf/fund_research_platform/api:${APP_VERSION:-dev}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: ghcr.io/wauf/fund_research_platform/api:${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network services talk by name, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_ENDPOINT_URL: http://seaweedfs:8333
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    image: ghcr.io/wauf/fund_research_platform/web:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  seaweedfsdata:
