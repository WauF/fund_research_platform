# Whole stack with one command:  cp .env.example .env && docker compose up --build
#   web  http://localhost:3000     api  http://localhost:8000/docs
#   minio console  http://localhost:9001
#
# Every port is bound to 127.0.0.1 only. On the VPS, Docker-published ports bypass the host
# firewall, so nothing here may listen publicly; a reverse proxy in front exposes web/api.
#
# APP_VERSION picks the image tag (default "dev" = built locally). Deploy/rollback later is
# `APP_VERSION=v0.1.0 docker compose up -d` against images from ghcr.io.
name: fund-platform

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The official minio/minio images are no longer published; Chainguard builds the same
  # open-source MinIO from source (amd64 + arm64). Free tier only offers `latest`, so the digest
  # pins it for reproducible builds. Bump: `docker pull chainguard/minio:latest` + new digest.
  minio:
    image: chainguard/minio:latest@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the PDF bucket, then exit. Safe to re-run.
  minio-init:
    image: chainguard/minio:latest@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set in .env}
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set fund http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "fund/$$MINIO_BUCKET"
    restart: "no"

  api:
    build: ./backend
    image: ghcr.io/wauf/fund_research_platform/api:${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network services talk by name, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./frontend
    image: ghcr.io/wauf/fund_research_platform/web:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
